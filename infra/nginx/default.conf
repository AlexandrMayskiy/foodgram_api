server {
    listen 80;
    server_name apulaz.zapto.org;
    server_tokens off;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name apulaz.zapto.org;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/apulaz.zapto.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apulaz.zapto.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location /api/docs/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /api/docs/index.html;
    }

    location /api/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/api/;
    }

    location /admin/ {
        proxy_set_header Host $http_host;
        proxy_pass http://backend:8000/admin/;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/admin/ {
        root /app/;
    }

    location /static/rest_framework/ {
        root /app/;
    }

    location /media/ {
        root /app/;
    }
}
