version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file: ./infra/.env
    volumes:
      - pg_data:/var/lib/postgresql/data
    restart: always

  backend:
    image: gubyam/foodgram_backend:latest
    env_file: ./infra/.env
    volumes:
      - static_value:/app/static/
      - media_value:/app/media/
      - ./data/ingredients.json:/app/data/ingredients.json:ro
    depends_on:
      - db
    restart: always

  nginx:
    image: nginx:1.25.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ../frontend/build:/usr/share/nginx/html/
      - ../docs/:/usr/share/nginx/html/api/docs/
      - static_value:/app/static/
      - media_value:/app/media/
      - /etc/letsencrypt/:/etc/letsencrypt/:ro
    depends_on:
      - backend
    restart: always

volumes:
  pg_data:
  static_value:
  media_value:
